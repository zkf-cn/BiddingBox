    <script>
      // 主题预置：在 Vue 挂载前同步应用，避免首屏主题闪烁（FOUC）
      (function () {
        try {
          // 应用经 utils/storage.js 写入的是 JSON 字符串（如 "light" 带引号），需 parse 还原
          var t = null
          try { t = JSON.parse(localStorage.getItem('app_theme')) } catch (e) { /* noop */ }
          // 纯手动切换：无有效保存值时固定为浅色（不跟随系统偏好）
          if (t !== 'light' && t !== 'dark') t = 'light'
          var root = document.documentElement
          root.setAttribute('data-theme', t)
          // 预置画布底色：CSS 注入前先填上对应主题背景，避免深色刷新出现白/蓝闪屏
          root.style.backgroundColor = (t === 'dark') ? '#16141a' : '#f2f0f5'
        } catch (e) {
          var r = document.documentElement
          r.setAttribute('data-theme', 'light')
          r.style.backgroundColor = '#f2f0f5'
        }
      })()
    </script>
